<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZORVÉN Home</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:radial-gradient(ellipse at 65% 10%,#4b4a52 0%,#26252b 55%,#17171a 100%);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.phone{width:100%;max-width:412px;margin:0 auto;min-height:100vh;position:relative;background:linear-gradient(180deg,#2c2a42 0%,#25233a 60%,#1d1c2e 100%);overflow:hidden;padding-bottom:88px}
.phone.noscroll{padding-bottom:0}
@media(min-width:500px){.phone{margin-top:20px;border-radius:26px 26px 0 0;min-height:calc(100vh - 20px)}}
.status{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 20px 4px;font-size:15px;font-weight:600}
.status .r{display:flex;gap:6px;align-items:center}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 10px;min-height:44px}
.brand{display:flex;align-items:center;gap:9px}.brand h1{font-size:22px;font-weight:700;letter-spacing:.4px}
.bk{font-size:32px;line-height:20px;cursor:pointer;padding:0 6px 4px 0}
.icons{display:flex;gap:20px}.icons span{display:flex;cursor:pointer;min-width:24px;min-height:24px;align-items:center;justify-content:center}
.ln{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;flex-wrap:nowrap;gap:6px;padding:4px 14px 14px;overflow-x:scroll;overflow-y:hidden;width:100%;touch-action:pan-y;scrollbar-width:none;cursor:grab;user-select:none;-webkit-user-select:none}
.chips::-webkit-scrollbar{display:none}.chips:after{content:"";flex:0 0 6px}
.chip{flex:none;height:34px;padding:0 12px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.22);font-size:13px;font-weight:600;color:#ececec;display:flex;align-items:center;gap:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 6px rgba(0,0,0,.25);cursor:pointer;white-space:nowrap}
.chip.on{background:#fff;color:#111;border-color:#fff}.chip.on svg path{fill:#111}

/* Taller Cinematic Hero Banner — Clean (No top indicator lines, no star badge, no spotlight label) */
.frame{margin:0 14px 4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 42px rgba(0,0,0,.48)}
.hero{height:clamp(495px,64vh,535px);border-radius:13px;position:relative;overflow:hidden;cursor:pointer;background:#181626}
.hbg{position:absolute;inset:0;background:radial-gradient(ellipse 65% 38% at 50% 34%,rgba(255,214,235,.28),transparent 70%),radial-gradient(ellipse 80% 42% at 50% 0%,rgba(140,120,190,.42),transparent 70%),linear-gradient(180deg,#4c436b 0%,#2d2846 48%,#161422 100%)}
.hero img.himg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:1;transform-origin:center 25%;animation:heroZoom 6.4s ease-out forwards}
@keyframes heroZoom{from{transform:scale(1)}to{transform:scale(1.06)}}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,12,22,.22) 0%,transparent 32%,rgba(16,14,26,.48) 58%,rgba(20,18,32,.88) 78%,rgba(24,22,38,.99) 100%);pointer-events:none;z-index:1}
.hero .z{position:absolute;top:12px;left:12px;z-index:2}
.info{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;text-align:center}
.info h2{font-size:clamp(22px,6vw,27px);font-weight:800;letter-spacing:1.2px;margin-bottom:6px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.85);line-height:1.15}
.info .hov{font-size:12px;color:#dad7e4;margin:0 auto 9px;max-width:94%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.38}
.tags{font-size:11px;color:#cfcbd8;margin-bottom:12px;display:flex;justify-content:center;gap:6px;align-items:center;flex-wrap:wrap}
.tags i{width:3px;height:3px;border-radius:50%;background:#e50914}
.btns{display:flex;gap:8px}
.btn{flex:1;height:42px;border:0;border-radius:6px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn.p{background:#fff;color:#000}.btn.s{background:rgba(140,136,160,.55);border:1px solid rgba(255,255,255,.16);color:#fff}

/* Discovery Section Rows & 16:9 Landscape Continue Watching Cards */
.row{padding:18px 0 0 14px}.row h3{font-size:15.5px;font-weight:700;margin-bottom:9px;letter-spacing:.2px;padding-right:14px}
.rail{display:flex;gap:8px;overflow-x:scroll;overflow-y:hidden;scrollbar-width:none;cursor:grab;padding-right:14px}
.rail::-webkit-scrollbar{display:none}
.tile{flex:none;width:106px;height:156px;border-radius:6px;position:relative;overflow:hidden;cursor:pointer;background:#191826;border:1px solid rgba(255,255,255,.08)}
.tile img.timg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:1;display:block}
.tile:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 0%,transparent 52%,rgba(10,9,16,.92) 100%);pointer-events:none;z-index:1}
.tile .z{position:absolute;top:5px;left:5px;z-index:2}
.tile .tlbl{position:absolute;left:6px;right:6px;bottom:6px;z-index:2;font-size:10.5px;font-weight:600;line-height:1.2;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 4px rgba(0,0,0,.9)}

/* 16:9 Landscape Continue Watching Tile (.tile.w) */
.tile.w{width:168px;height:95px;aspect-ratio:16/9;border-radius:6px}
.tile.w img.timg{object-fit:cover;object-position:center center}
.tile.w:after{background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,transparent 40%,rgba(10,9,16,.94) 100%)}
.tile.w .pl{position:absolute;left:50%;top:46%;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;border:2px solid rgba(255,255,255,.95);background:rgba(0,0,0,.52);display:flex;align-items:center;justify-content:center;z-index:3}
.tile.w .tlbl{bottom:8px;font-size:11px;font-weight:700;-webkit-line-clamp:1}
.tile.w .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.28);z-index:3}
.tile.w .bar i{display:block;height:100%;background:#e50914}

.nb{flex:none;display:flex;align-items:flex-end;width:140px;cursor:pointer;position:relative}
.nb em{font-style:normal;font-size:90px;font-weight:900;line-height:.82;color:#1e1c2e;-webkit-text-stroke:2.6px #aba8bc;margin-right:-14px;letter-spacing:-6px;z-index:3;pointer-events:none;text-shadow:0 4px 12px rgba(0,0,0,.6)}

/* Bottom Navigation */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:412px;display:flex;justify-content:space-around;padding:9px 0 calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(36,34,54,.92),rgba(22,20,34,.98));border-top:1px solid rgba(255,255,255,.18);border-radius:18px 18px 0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 -8px 24px rgba(0,0,0,.35);z-index:20}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#a8a6b6;width:25%;cursor:pointer}
.nav a.on{color:#fff}.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav .hm{fill:currentColor;stroke:none}
.av{width:24px;height:24px;border-radius:5px;background:var(--pc,#e50914);position:relative;border:1px solid rgba(255,255,255,.6)}
.av:before,.av:after{content:"";position:absolute;top:8px;width:3px;height:3px;border-radius:50%;background:#fff}.av:before{left:6px}.av:after{right:6px}
.av i{position:absolute;left:6px;right:6px;bottom:5px;height:4px;border-bottom:1.6px solid #fff;border-radius:0 0 6px 6px}

/* Search Page & True 16:9 Landscape TMDB Thumbnail System */
.sb{margin:6px 14px 4px;height:42px;border-radius:10px;background:rgba(255,255,255,.12);display:flex;align-items:center;gap:10px;padding:0 12px;border:1px solid rgba(255,255,255,.14)}
.sb input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:15px;min-width:0}.sb input::placeholder{color:#b4b2c2}.sb .mc{display:flex;cursor:pointer;padding:4px}
.pt{padding:12px 14px 8px;font-size:16.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pt small{font-size:12px;color:#b4b2c2;font-weight:500;flex:none}
.sr{display:flex;align-items:center;gap:12px;padding:8px 14px;margin-bottom:4px;cursor:pointer;min-height:88px;border-bottom:1px solid rgba(255,255,255,.05)}
.sr .th{flex:0 0 136px;width:136px;aspect-ratio:16/9;border-radius:6px;position:relative;overflow:hidden;background:#191826;border:1px solid rgba(255,255,255,.1)}
.sr .th img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block}
.sr .th .z{position:absolute;top:4px;left:4px;z-index:2}
.sr .sbody{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2.5px}
.sr .stitle{font-size:14.5px;font-weight:700;color:#fff;line-height:1.22;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.sr .smeta{font-size:11.5px;color:#c2bfd0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .sdesc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;color:#9d9ab0;font-weight:400;line-height:1.34;word-break:break-word}
.sr .pc{flex:0 0 34px;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center}
@media(max-width:359px){
  .sr{gap:10px;padding:7px 10px}
  .sr .th{flex:0 0 114px;width:114px}
  .sr .stitle{font-size:13.5px}
  .sr .pc{flex:0 0 30px;width:30px;height:30px}
}

/* Clips Feed */
.cf{overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;margin:0 14px;border-radius:12px;touch-action:pan-y;overscroll-behavior:contain}
.cf::-webkit-scrollbar{display:none}
.cl{height:100%;scroll-snap-align:start;scroll-snap-stop:always;border-radius:12px;position:relative;overflow:hidden;margin-bottom:8px;background:#191826}
.cl img.climg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:1}
.cl:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),transparent 25%,transparent 50%,rgba(8,7,14,.95));pointer-events:none;z-index:1}
.cl .z{position:absolute;top:12px;left:12px;z-index:2}
.cl .ac{position:absolute;right:10px;bottom:110px;display:flex;flex-direction:column;gap:18px;align-items:center;font-size:11px;z-index:3}
.cl .ac>div{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.ac .pi svg,.ac>div>svg{width:26px;height:26px}
.cl .bt{position:absolute;left:14px;right:62px;bottom:14px;z-index:3}
.cl .bt h4{font-size:19px;margin-bottom:4px;cursor:pointer}.cl .bt p{font-size:12px;color:#d8d5e2;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cl .bt .b{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:4px;background:#fff;color:#000;font-weight:700;font-size:14px;margin-right:6px;cursor:pointer}
.cl .bt .b.g{background:rgba(140,136,160,.7);color:#fff}
.like.on svg{fill:#fff}.m1{display:none}.muted .m0{display:none}.muted .m1{display:block}

/* Profile & Subpages */
.pf{display:flex;flex-direction:column;align-items:center;padding:6px 0 14px}
.pf .a{width:84px;height:84px;border-radius:14px;background:var(--pc,#e50914);position:relative;border:2px solid rgba(255,255,255,.7)}
.pf .a:before,.pf .a:after{content:"";position:absolute;top:30px;width:9px;height:9px;border-radius:50%;background:#fff}.pf .a:before{left:22px}.pf .a:after{right:22px}
.pf .a i{position:absolute;left:24px;right:24px;bottom:18px;height:12px;border-bottom:4px solid #fff;border-radius:0 0 20px 20px}
.pf h2{margin-top:10px;font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer}
.mr{margin:0 14px 8px;min-height:54px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:14px;padding:0 14px;font-size:15px;font-weight:600;cursor:pointer}
.mr small{display:block;font-size:11px;color:#b4b2c2;font-weight:400;margin-top:2px}.mr .ch{margin-left:auto;font-size:22px;color:#b4b2c2}
.mr .bd{position:relative;display:flex}.mr .bd:after{content:"";position:absolute;top:-2px;right:-3px;width:9px;height:9px;border-radius:50%;background:#e50914}
.sh{display:flex;justify-content:space-between;align-items:center;padding:16px 14px 8px}.sh h3{font-size:16px;font-weight:700}.sh span{font-size:13px;color:#b4b2c2;cursor:pointer}
.empty{margin:0 14px;color:#b4b2c2;font-size:13px;padding:14px 0;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px}.grid .tile{width:100%;height:auto;aspect-ratio:2/3}
.sw{flex:none;width:46px;height:28px;border-radius:14px;background:#55526a;position:relative;margin-left:auto;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:#46d369}.sw.on:after{left:21px}

/* Bottom Sheets, Toast & Video Player */
#sbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none}
#sh{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:412px;max-height:82vh;overflow:auto;background:linear-gradient(180deg,rgba(62,59,86,.98),rgba(32,30,48,.99));border-radius:18px 18px 0 0;z-index:51;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:none}
#sh .grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.35);margin:0 auto 12px}
#sh h3.t{font-size:17px;margin-bottom:6px}
.opt{display:flex;align-items:center;gap:12px;min-height:50px;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px;cursor:pointer}
.opt img{width:28px;height:28px;border-radius:6px;object-fit:cover;background:#111}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:rgba(255,255,255,.96);color:#111;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:600;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}.toast.on{opacity:1}
/* =========================================================================
   PURE FULL-SCREEN LANDSCAPE PLAYER UI (#pl)
   Fills 100vw x 100vh, pure clean video player, zero extra clutter
   ========================================================================= */
#pl{position:fixed;inset:0;width:100vw;height:100vh;z-index:999;display:none;background:#000;color:#fff;overflow:hidden}
#pl .pl-stage{position:absolute;inset:0;width:100%;height:100%;background:#000;overflow:hidden}
#pl .pl-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000;z-index:1}
#pl .pl-floating-back{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));width:44px;height:44px;border-radius:50%;background:rgba(18,16,28,0.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.22);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;box-shadow:0 4px 18px rgba(0,0,0,0.65);z-index:50;opacity:0;pointer-events:none;transform:scale(0.92);transition:opacity 0.28s ease,transform 0.28s ease,background 0.15s}
#pl .pl-floating-back.visible{opacity:1;pointer-events:auto;transform:scale(1)}
#pl .pl-floating-back:active{transform:scale(0.88);background:rgba(229,9,20,0.95)}
#pl .pl-loading{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:#000;transition:opacity .25s}
#pl .pl-loading.hidden{opacity:0;pointer-events:none;display:none}
#pl .pl-loading-bar{width:50%;max-width:200px;height:5px;border-radius:99px;overflow:hidden}
#pl .pl-loading small{font-size:12px;color:#b4b2c2;letter-spacing:.3px}
#pl .pl-error{position:absolute;inset:0;z-index:4;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:#12101e}
#pl .pl-error.visible{display:flex}
#pl .pl-error h4{font-size:16px;font-weight:700;margin-bottom:6px;color:#fff}
#pl .pl-error p{font-size:12.5px;color:#b4b2c2;max-width:320px;line-height:1.45;margin-bottom:14px}
#pl .pl-error-btns{display:flex;gap:10px}
#pl .pl-error-btns button{height:36px;padding:0 18px;border-radius:6px;border:0;font-size:13px;font-weight:700;cursor:pointer}
#pl .pl-error-btns .retry{background:#e50914;color:#fff}
#pl .pl-error-btns .close{background:rgba(255,255,255,.16);color:#fff}
.api-state{margin:24px 14px;padding:24px 16px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);text-align:center}
.api-state h4{font-size:16px;margin-bottom:8px}
.api-state p{font-size:13px;color:#c9c6d6;line-height:1.45;margin-bottom:14px;word-break:break-word}
.more-btn{margin:14px 14px 6px;height:40px;border-radius:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* Premium Skeleton Shimmer System (WebView-safe background shimmer) */
.skel{background:linear-gradient(100deg,#1d1b2b 25%,#2d2a42 50%,#1d1b2b 75%);background-size:200% 100%;animation:shimmerSweep 1.4s ease-in-out infinite;border-radius:6px}
@keyframes shimmerSweep{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){
  .skel{animation:none;background:#222032}
  .hero img.himg{animation:none}
}
.skel-hero{height:clamp(495px,64vh,535px);border-radius:13px;position:relative;overflow:hidden;background:#1b192a;display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
.skel-line{height:12px;border-radius:4px;margin-bottom:8px}
.skel-title{height:24px;width:68%;margin:0 auto 10px;border-radius:6px}
.skel-sub{height:12px;width:84%;margin:0 auto 6px;border-radius:4px}
.skel-tags{height:10px;width:54%;margin:0 auto 14px;border-radius:4px}
.skel-btns{display:flex;gap:8px}
.skel-btn{flex:1;height:42px;border-radius:6px}
.skel-sec-hdr{width:148px;height:16px;border-radius:4px;margin-bottom:10px}
.skel-tile{flex:none;width:106px;height:156px;border-radius:6px}
.skel-tile-w{flex:none;width:168px;height:95px;border-radius:6px}
.skel-sr{display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:88px;border-bottom:1px solid rgba(255,255,255,.04)}
.skel-sr-th{flex:0 0 136px;width:136px;aspect-ratio:16/9;border-radius:6px}
.skel-sr-body{flex:1;min-width:0}
.skel-sr-circle{flex:0 0 34px;width:34px;height:34px;border-radius:50%}
@media(max-width:359px){
  .skel-sr-th{flex:0 0 114px;width:114px}
  .skel-sr-circle{flex:0 0 30px;width:30px;height:30px}
}
</style>
</head>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="z" viewBox="0 0 24 40"><path d="M0 0H24V9H0Z" fill="#e50914"/><path d="M0 31H24V40H0Z" fill="#e50914"/><path d="M13 8H24L11 32H0Z" fill="#e50914"/><path d="M24 9V14.5L21 9Z" fill="#8f0710"/><path d="M0 31V25.5L3 31Z" fill="#8f0710"/></symbol></defs></svg>
<div class="phone muted">
  <div class="status"><span>9:41</span><span class="r">

<script>
(function(){
/* =========================================================================
   PRODUCTION UNIFIED V1 + TMDB API CLIENT (https://anymovie.ai.studio/api/v1)
   Strictly uses ONLY the production domain https://anymovie.ai.studio
   ========================================================================= */
var PROD_DOMAIN = 'https://anymovie.ai.studio';
var PROD_API_BASE = 'https://anymovie.ai.studio/api/v1';
var apiCallbacks = {};
var apiCallSeq = 0;
var memCache = {};

window.__onAnymovieApiResult = function(cbId, ok, payload) {
  var cb = apiCallbacks[cbId];
  if (!cb) return;
  delete apiCallbacks[cbId];
  if (ok) {
    try {
      var parsed = JSON.parse(payload);
      cb.resolve(parsed);
    } catch (e) {
      cb.reject(new Error('Invalid JSON from production API: ' + e.message));
    }
  } else {
    cb.reject(new Error(payload || 'Production API request failed'));
  }
};

function apiGet(path, forceRefresh) {
  var normPath = path.indexOf('/') === 0 ? path : '/' + path;
  if (!forceRefresh && memCache[normPath]) {
    return Promise.resolve(memCache[normPath]);
  }
  if (window.AnymovieApiBridge && typeof window.AnymovieApiBridge.fetchEndpoint === 'function') {
    return new Promise(function(resolve, reject) {
      var cbId = 'cb_' + (++apiCallSeq) + '_' + Date.now();
      apiCallbacks[cbId] = {
        resolve: function(res) {
          if (res && res.success !== false) {
            memCache[normPath] = res;
            resolve(res);
          } else {
            reject(new Error((res && (res.error || res.message)) || ('API error on ' + normPath)));
          }
        },
        reject: reject
      };
      window.AnymovieApiBridge.fetchEndpoint(normPath, cbId, !!forceRefresh);
    });
  }
  return fetch(PROD_API_BASE + normPath, {
    method: 'GET',
    headers: { 'Accept': 'application/json' }
  }).then(function(r) {
    if (!r.ok) throw new Error('Production API HTTP ' + r.status + ' at ' + PROD_API_BASE + normPath);
    return r.json();
  }).then(function(res) {
    if (res && res.success === false) {
      throw new Error(res.error || res.message || ('API failure on ' + normPath));
    }
    memCache[normPath] = res;
    return res;
  });
}

function isValidHttpImg(u) {
  if (!u || typeof u !== 'string') return false;
  var s = u.trim();
  if (!s || s.indexOf('data:') === 0 || s.indexOf('blob:') === 0) return false;
  return s.indexOf('https://') === 0 || s.indexOf('http://') === 0 || s.indexOf('//') === 0 || s.indexOf('/') === 0;
}

function resolveImg(u, mode) {
  if (!isValidHttpImg(u)) return '';
  var s = u.trim();
  if (s.indexOf('//') === 0) s = 'https:' + s;
  else if (s.indexOf('/') === 0) s = PROD_DOMAIN + s;

  // TMDB size optimization:
  // w500 for landscape (~50KB) and w342 for portrait posters (~35KB) load fast and reliably
  if (s.indexOf('image.tmdb.org/t/p/') > -1) {
    if (mode === 'hero') {
      return s.replace(/\/t\/p\/(?:original|w[0-9]+)\//, '/t/p/w1280/');
    } else if (mode === 'landscape') {
      return s.replace(/\/t\/p\/(?:original|w[0-9]+)\//, '/t/p/w500/');
    } else {
      return s.replace(/\/t\/p\/(?:original|w[0-9]+)\//, '/t/p/w342/');
    }
  }

  // Amazon/IMDb image size optimization:
  if (s.indexOf('m.media-amazon.com/images/') > -1 && s.indexOf('._V1_') > -1) {
    var base = s.split('._V1_')[0];
    if (mode === 'hero') return base + '._V1_QL85_UX900_.jpg';
    if (mode === 'landscape') return base + '._V1_QL80_UX600_.jpg';
    return base + '._V1_QL80_UX360_.jpg';
  }
  return s;
}

function hasTmdbLandscape(item) {
  if (!item) return false;
  var tNum = extractTmdbNumericId(item);
  if (tNum && tmdbEnrichedMap[tNum] && isValidHttpImg(tmdbEnrichedMap[tNum].backdrop)) return true;
  var bd = String(item.backdrop || '');
  return isValidHttpImg(bd) && bd.indexOf('image.tmdb.org/t/p/') > -1;
}

function resolveLandscapeThumb(item) {
  if (!item) return '';
  var tNum = extractTmdbNumericId(item);
  if (tNum && tmdbEnrichedMap[tNum]) {
    var enr = tmdbEnrichedMap[tNum];
    if (isValidHttpImg(enr.backdrop)) return resolveImg(enr.backdrop, 'landscape');
  }
  var bd = isValidHttpImg(item.backdrop) ? item.backdrop : '';
  var po = isValidHttpImg(item.poster) ? item.poster : '';
  if (bd && bd.indexOf('image.tmdb.org') > -1) return resolveImg(bd, 'landscape');
  if (bd && po && bd.split('._V1_')[0] !== po.split('._V1_')[0]) return resolveImg(bd, 'landscape');
  if (tNum && tmdbEnrichedMap[tNum] && isValidHttpImg(tmdbEnrichedMap[tNum].poster)) {
    return resolveImg(tmdbEnrichedMap[tNum].poster, 'landscape');
  }
  return resolveImg(bd || po, 'landscape');
}

function resolvePortraitPoster(item) {
  if (!item) return '';
  var tNum = extractTmdbNumericId(item);
  if (tNum && tmdbEnrichedMap[tNum]) {
    var enr = tmdbEnrichedMap[tNum];
    if (isValidHttpImg(enr.poster)) return resolveImg(enr.poster, 'poster');
  }
  var po = isValidHttpImg(item.poster) ? item.poster : '';
  var bd = isValidHttpImg(item.backdrop) ? item.backdrop : '';
  if (po) return resolveImg(po, 'poster');
  if (tNum && tmdbEnrichedMap[tNum] && isValidHttpImg(tmdbEnrichedMap[tNum].backdrop)) {
    return resolveImg(tmdbEnrichedMap[tNum].backdrop, 'poster');
  }
  return resolveImg(bd, 'poster');
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* Multi-stage automatic thumbnail recovery so no valid movie/series card ever shows blank */
window.onThumbError = function(img) {
  if (!img) return;
  var fb = img.getAttribute('data-fb') || '';
  if (fb && img.getAttribute('data-tried-fb') !== '1' && fb !== img.src) {
    img.setAttribute('data-tried-fb', '1');
    img.src = fb;
    return;
  }
  var orig = img.getAttribute('data-orig') || '';
  if (orig && img.getAttribute('data-tried-orig') !== '1' && orig !== img.src) {
    img.setAttribute('data-tried-orig', '1');
    img.src = orig;
    return;
  }
  if (img.getAttribute('data-tried-api') !== '1') {
    img.setAttribute('data-tried-api', '1');
    var tNum = img.getAttribute('data-tmdbid') || '';
    var isSeries = img.getAttribute('data-series') === 'true';
    var title = img.getAttribute('data-title') || '';
    var mode = img.getAttribute('data-mode') || 'poster';
    var lookupPromise;
    if (tNum) {
      var ep = (isSeries ? '/series/tmdb-' : '/movie/tmdb-') + encodeURIComponent(tNum);
      lookupPromise = apiGet(ep, false).then(function(res) { return res && res.data; }).catch(function() { return null; });
    } else if (title) {
      lookupPromise = apiGet('/search?q=' + encodeURIComponent(title) + '&type=all&page=1&limit=3', false)
        .then(function(res) {
          var arr = (res && Array.isArray(res.data)) ? res.data : [];
          return arr[0] || null;
        }).catch(function() { return null; });
    } else {
      lookupPromise = Promise.resolve(null);
    }
    lookupPromise.then(function(d) {
      if (d) {
        registerTmdbEnrichedObject(d);
        var cand = (mode === 'landscape')
          ? (isValidHttpImg(d.backdrop) ? resolveImg(d.backdrop, 'landscape') : resolveImg(d.poster, 'landscape'))
          : (isValidHttpImg(d.poster) ? resolveImg(d.poster, 'poster') : resolveImg(d.backdrop, 'poster'));
        if (cand && cand !== img.src) {
          img.src = cand;
          return;
        }
      }
      img.style.display = 'none';
    });
    return;
  }
  img.style.display = 'none';
};

function buildThumbImgHtml(item, mode, className) {
  if (!item) return '';
  var primary = (mode === 'landscape')
    ? resolveLandscapeThumb(item)
    : (mode === 'hero' ? (resolvePortraitPoster(item) || resolveLandscapeThumb(item)) : resolvePortraitPoster(item));
  var secondary = (mode === 'landscape')
    ? resolvePortraitPoster(item)
    : resolveLandscapeThumb(item);
  var rawOrig = '';
  if (mode === 'landscape') {
    rawOrig = isValidHttpImg(item.backdrop) ? item.backdrop : (isValidHttpImg(item.poster) ? item.poster : '');
  } else {
    rawOrig = isValidHttpImg(item.poster) ? item.poster : (isValidHttpImg(item.backdrop) ? item.backdrop : '');
  }
  var srcUrl = primary || secondary || rawOrig;
  if (!srcUrl) return '';
  var tNum = extractTmdbNumericId(item);
  var isSeries = !!(item.isSeries || item.type === 'tv');
  var clsAttr = className ? (' class="' + esc(className) + '"') : '';
  return '<img' + clsAttr +
    ' src="' + esc(srcUrl) + '"' +
    ' data-fb="' + esc(secondary || '') + '"' +
    ' data-orig="' + esc(rawOrig || '') + '"' +
    ' data-tmdbid="' + esc(tNum) + '"' +
    ' data-series="' + (isSeries ? 'true' : 'false') + '"' +
    ' data-title="' + esc(item.title || '') + '"' +
    ' data-mode="' + esc(mode || 'poster') + '"' +
    ' alt="' + esc(item.title || '') + '"' +
    ' decoding="async"' +
    ' onerror="window.onThumbError(this)">';
}

/* =========================================================================
   TMDB ENRICHMENT & CANONICAL DEDUPLICATION ENGINE
   Upgrades items via /movie/tmdb-{tmdbId} and /series/tmdb-{tmdbId} so
   Continue Watching, Search, and Hero have true 16:9 TMDB backdrops & plots
   ========================================================================= */
var tmdbEnrichedMap = {};
var pendingTmdbFetches = {};

function extractTmdbNumericId(item) {
  if (!item) return '';
  if (item.tmdbId) return String(item.tmdbId);
  var rawId = String(item.id || '');
  if (rawId.indexOf('tmdb-') === 0) return rawId.slice(5);
  return '';
}

function getCanonicalId(item) {
  if (!item) return '';
  if (typeof item === 'string') return item.trim().toLowerCase();
  var tNum = extractTmdbNumericId(item);
  if (tNum) return 'tmdb_' + tNum;
  var normTitle = String(item.title || item.name || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
  if (normTitle) return 'title_' + normTitle;
  var rawId = item.imdbId || item.id;
  return rawId ? String(rawId).trim().toLowerCase() : '';
}

function applyTmdbRecordToItem(target, tmdbObj) {
  if (!target || !tmdbObj) return target;
  var tNum = extractTmdbNumericId(tmdbObj) || extractTmdbNumericId(target);
  if (tNum) target.tmdbId = Number(tNum) || tNum;
  if (isValidHttpImg(tmdbObj.poster) && String(tmdbObj.poster).indexOf('image.tmdb.org') > -1) {
    target.poster = tmdbObj.poster;
  }
  if (isValidHttpImg(tmdbObj.backdrop) && String(tmdbObj.backdrop).indexOf('image.tmdb.org') > -1) {
    target.backdrop = tmdbObj.backdrop;
  }
  if (tmdbObj.overview && String(tmdbObj.overview).indexOf('high-speed multi-server') === -1) {
    target.overview = tmdbObj.overview;
  }
  if (tmdbObj.year) target.year = tmdbObj.year;
  if (tmdbObj.rating) target.rating = tmdbObj.rating;
  if (tmdbObj.voteAverage != null) target.voteAverage = tmdbObj.voteAverage;
  if (Array.isArray(tmdbObj.genres) && tmdbObj.genres.length) target.genres = tmdbObj.genres;
  return target;
}

function registerTmdbEnrichedObject(tmdbObj) {
  if (!tmdbObj || !tmdbObj.id) return;
  var tNum = extractTmdbNumericId(tmdbObj);
  if (tNum) {
    var validPo = (isValidHttpImg(tmdbObj.poster) && tmdbObj.poster.indexOf('image.tmdb.org') > -1) ? tmdbObj.poster : '';
    var validBd = (isValidHttpImg(tmdbObj.backdrop) && tmdbObj.backdrop.indexOf('image.tmdb.org') > -1) ? tmdbObj.backdrop : '';
    var prev = tmdbEnrichedMap[tNum] || {};
    tmdbEnrichedMap[tNum] = {
      id: tmdbObj.id,
      tmdbId: tNum,
      title: tmdbObj.title || tmdbObj.name || prev.title || '',
      poster: validPo || prev.poster || '',
      backdrop: validBd || prev.backdrop || '',
      overview: tmdbObj.overview || prev.overview || '',
      year: tmdbObj.year || prev.year || '',
      rating: tmdbObj.rating || prev.rating || '',
      voteAverage: tmdbObj.voteAverage != null ? tmdbObj.voteAverage : prev.voteAverage,
      genres: (Array.isArray(tmdbObj.genres) && tmdbObj.genres.length) ? tmdbObj.genres : (prev.genres || []),
      type: tmdbObj.type || (tmdbObj.isSeries ? 'tv' : 'movie'),
      isSeries: !!tmdbObj.isSeries || tmdbObj.type === 'tv'
    };
  }
  indexItem(tmdbObj);
}

/* Enrich any list of items that have tmdbId with real TMDB 16:9 backdrops from anymovie API */
function enrichItemsWithTmdb(items, onUpdated) {
  if (!Array.isArray(items) || !items.length) return;
  var promises = [];
  items.forEach(function(it) {
    if (!it) return;
    var tNum = extractTmdbNumericId(it);
    if (!tNum) return;
    if (tmdbEnrichedMap[tNum] && tmdbEnrichedMap[tNum].backdrop && tmdbEnrichedMap[tNum].poster) {
      applyTmdbRecordToItem(it, tmdbEnrichedMap[tNum]);
      indexItem(it);
      return;
    }
    if (hasTmdbLandscape(it) && isValidHttpImg(it.poster) && it.poster.indexOf('image.tmdb.org') > -1 && it.overview && String(it.overview).indexOf('high-speed multi-server') === -1) {
      registerTmdbEnrichedObject(it);
      return;
    }
    var isTv = !!it.isSeries || it.type === 'tv';
    var ep = (isTv ? '/series/tmdb-' : '/movie/tmdb-') + encodeURIComponent(tNum);
    if (!pendingTmdbFetches[ep]) {
      pendingTmdbFetches[ep] = apiGet(ep, false)
        .then(function(res) {
          var d = res && res.data;
          if (d && d.id) {
            registerTmdbEnrichedObject(d);
            return d;
          }
          return null;
        })
        .catch(function() { return null; });
    }
    promises.push(pendingTmdbFetches[ep].then(function(d) {
      if (d) {
        applyTmdbRecordToItem(it, d);
        indexItem(it);
      }
    }));
  });
  if (promises.length > 0 && typeof onUpdated === 'function') {
    Promise.all(promises).then(onUpdated);
  }
}

/* Deduplicate items and merge TMDB 16:9 backdrop/overview into matching items */
function dedupeItemsList(list, externalSeenSet, maxCount) {
  if (!Array.isArray(list)) return [];
  var byCid = {};
  var order = [];
  for (var i = 0; i < list.length; i++) {
    var it = list[i];
    if (!it || (!it.id && !it.title)) continue;
    var tNum = extractTmdbNumericId(it);
    if (tNum && tmdbEnrichedMap[tNum]) {
      applyTmdbRecordToItem(it, tmdbEnrichedMap[tNum]);
    }
    var cid = getCanonicalId(it);
    if (!cid) continue;
    if (externalSeenSet && externalSeenSet[cid]) continue;
    if (!byCid[cid]) {
      byCid[cid] = it;
      order.push(cid);
    } else {
      // Merge: if the later item has a true TMDB 16:9 backdrop or real overview, upgrade existing entry
      applyTmdbRecordToItem(byCid[cid], it);
      if (String(it.id || '').indexOf('tmdb-') === 0 && String(byCid[cid].id || '').indexOf('tmdb-') !== 0) {
        byCid[cid].id = it.id;
      }
    }
  }
  var out = [];
  for (var j = 0; j < order.length; j++) {
    var k = order[j];
    if (externalSeenSet) externalSeenSet[k] = true;
    out.push(byCid[k]);
    if (maxCount && out.length >= maxCount) break;
  }
  return out;
}

function numericRating(item) {
  if (!item) return 0;
  if (item.voteAverage != null && !isNaN(Number(item.voteAverage))) return Number(item.voteAverage);
  if (item.rating) {
    var m = String(item.rating).match(/(\d+(\.\d+)?)/);
    if (m) return parseFloat(m[1]);
  }
  return 0;
}

function restoreHomeCache() {
  try {

    if (!raw) return false;

    if (c && c.dedupedHome && c.dedupedHome.heroPool && c.dedupedHome.heroPool.length) {

  } catch (e) {}

}

/* Fast Stale-While-Revalidate Production Data Loader */
function loadInitialProductionData(force) {
  // If we already have cache restored, keep loadingHome false so no skeleton shimmer appears
  if (!API_DATA.dedupedHome) {
    if (restoreHomeCache()) {
      API_DATA.loadingHome = false;
      render(true);
      startHeroAutoCycle();
    } else {
      // First run: immediately render from PRESET_FRESH_TMDB_ITEMS so shimmer is never shown
      API_DATA.freshTmdbItems = PRESET_FRESH_TMDB_ITEMS.slice();
      API_DATA.dedupedHome = buildDeduplicatedHome({
        hero: PRESET_FRESH_TMDB_ITEMS.slice(0, 5),
        topRated: PRESET_FRESH_TMDB_ITEMS.slice(0, 10),
        trending: PRESET_FRESH_TMDB_ITEMS.slice(5, 17),
        newReleases: PRESET_FRESH_TMDB_ITEMS.slice(0, 8),
        popularSeries: PRESET_FRESH_TMDB_ITEMS.filter(function(x){ return x.isSeries; }),
        popularMovies: PRESET_FRESH_TMDB_ITEMS.filter(function(x){ return !x.isSeries; })
      }, [], [], PRESET_FRESH_TMDB_ITEMS);
      API_DATA.loadingHome = false;
      render(true);
      startHeroAutoCycle();
    }
  }

  // Fetch primary discovery endpoints in parallel
  Promise.all([
    apiGet('/home?limit=20', force).catch(function(){ return null; }),
    apiGet('/discover?platform=netflix&status=RELEASED', force).catch(function(){ return null; })
  ]).then(function(results) {
    var homeRes = results[0] && results[0].data ? results[0].data : null;
    var netflixRes = results[1] && Array.isArray(results[1].data) ? results[1].data : [];
    if (!homeRes) return;

    var catRes = homeRes.categories || [];
    var genRes = homeRes.genres || [];
    var platRes = homeRes.platforms || [];
    var freshTmdb = PRESET_FRESH_TMDB_ITEMS.slice();

    API_DATA.home = homeRes;
    API_DATA.freshTmdbItems = freshTmdb;
    if (catRes.length) API_DATA.categories = catRes;
    if (genRes.length) API_DATA.genres = genRes;
    if (platRes.length) API_DATA.platforms = platRes;
    API_DATA.dedupedHome = buildDeduplicatedHome(homeRes, netflixRes, [], freshTmdb);
    API_DATA.loadingHome = false;
    API_DATA.homeError = null;

    saveHomeCache();
    saveST();
    render(true);
    startHeroAutoCycle();

    // Background enrichment: enrich remaining catalogue items in batches so every card has canonical TMDB images
    setTimeout(function() {
      enrichItemsWithTmdb(API_DATA.allCatalogue.slice(0, 35), function() {
        API_DATA.dedupedHome = buildDeduplicatedHome(homeRes, netflixRes, [], freshTmdb);
        saveHomeCache();
        if (ST.tab === 0 && !ST.sub) render(true);
      });
    }, 600);
  }).catch(function(err) {
    if (!API_DATA.dedupedHome) {
      API_DATA.homeError = err && err.message ? err.message : 'Unable to connect to catalogue';
      render(true);
    }
  });
}

function loadFilteredDiscovery(queryPath, label, page, append) {
  API_DATA.loadingFilter = true;
  API_DATA.filteredTitle = label;
  API_DATA.filterQueryPath = queryPath;
  if (!append) {
    API_DATA.filteredItems = [];
    API_DATA.heroIndex = 0;
  }
  render(true);

  var sep = queryPath.indexOf('?') > -1 ? '&' : '?';
  var fullPath = queryPath + sep + 'page=' + (page || 1) + '&limit=20';

  apiGet(fullPath, false).then(function(res) {
    var items = Array.isArray(res.data) ? res.data : [];
    indexList(items);
    var combined = append ? (API_DATA.filteredItems || []).concat(items) : items;
    API_DATA.filteredItems = dedupeItemsList(combined, null, 200);
    var pg = res.pagination || {};
    API_DATA.filterPage = pg.page || (page || 1);
    API_DATA.filterTotalPages = pg.totalPages || 1;
    API_DATA.loadingFilter = false;
    saveST();
    render(true);
    enrichItemsWithTmdb(API_DATA.filteredItems, function() {
      if (ST.tab === 0) render(true);
    });
  }).catch(function(err) {
    API_DATA.loadingFilter = false;
    toast(err.message || 'Filter request failed');
    render(true);
  });
}

var searchTimer = null;
function performApiSearch(query, type, page, append) {
  API_DATA.loadingSearch = true;
  API_DATA.searchError = null;
  API_DATA.searchQuery = query;
  API_DATA.searchType = type || 'all';
  updateSearchDomOrRender();

  var qTrim = (query || '').trim();
  if (!qTrim && API_DATA.searchType === 'all') {
    var tmdbSeed = dedupeItemsList((API_DATA.freshTmdbItems || []).concat(API_DATA.allCatalogue || []).filter(function(x) {
      return hasTmdbLandscape(x);
    }), null, 24);
    if (tmdbSeed.length > 0) {
      API_DATA.searchResults = tmdbSeed;
      API_DATA.searchPage = 1;
      API_DATA.searchTotalPages = 1;
      API_DATA.searchTotalResults = tmdbSeed.length;
      API_DATA.loadingSearch = false;
      updateSearchDomOrRender();
      return;
    }
  }

  var path;
  if (!qTrim) {
    if (API_DATA.searchType === 'anime') {
      path = '/discover?category=Anime&page=' + (page || 1) + '&limit=20';
    } else if (API_DATA.searchType === 'movie') {
      path = '/movies?page=' + (page || 1) + '&limit=20';
    } else if (API_DATA.searchType === 'tv') {
      path = '/series?page=' + (page || 1) + '&limit=20';
    } else {
      path = '/movies?page=' + (page || 1) + '&limit=20';
    }
  } else {
    path = '/search?q=' + encodeURIComponent(qTrim) + '&type=' + encodeURIComponent(API_DATA.searchType) + '&page=' + (page || 1) + '&limit=20';
  }

  apiGet(path, false).then(function(res) {
    var items = Array.isArray(res.data) ? res.data : [];
    // Sort items with true 16:9 TMDB backdrops first before deduplicating so TMDB versions always win over portrait Amazon items
    items.sort(function(a, b) {
      var aT = hasTmdbLandscape(a) ? 1 : 0;
      var bT = hasTmdbLandscape(b) ? 1 : 0;
      return bT - aT;
    });
    indexList(items);
    var combined = append ? API_DATA.searchResults.concat(items) : items;
    API_DATA.searchResults = dedupeItemsList(combined, null, 200);
    var pg = res.pagination || {};
    API_DATA.searchPage = pg.page || (page || 1);
    API_DATA.searchTotalPages = pg.totalPages || 1;
    API_DATA.searchTotalResults = API_DATA.searchResults.length;
    API_DATA.loadingSearch = false;
    saveST();
    updateSearchDomOrRender();
    // Enrich any remaining non-TMDB items in the search results with 16:9 TMDB backdrops
    enrichItemsWithTmdb(API_DATA.searchResults, function() {
      if (ST.tab === 2 && !ST.sub) updateSearchDomOrRender();
    });
  }).catch(function(err) {
    API_DATA.loadingSearch = false;
    API_DATA.searchError = err && err.message ? err.message : 'Search request failed';
    updateSearchDomOrRender();
  });
}

function home(){

    } else if (listItems.length <= 10) {
      h += renderSectionRow(API_DATA.filteredTitle || 'Filtered Catalogue', listItems, 't', 0);
    } else {

    var cwSeries = dedupeItemsList(allSeries.filter(hasTmdbLandscape), null, 6);
    var rankedSeries = allSeries.slice().sort(function(a, b){ return numericRating(b) - numericRating(a); });
    var top10Series = dedupeItemsList(rankedSeries, seenShows, 10);
    var trendingSeries = dedupeItemsList(allSeries, seenShows, 12);

    var allMovies = (API_DATA.freshTmdbItems || []).concat(allCat).filter(function(x){ return !x.isSeries && x.type === 'movie' && !x.isUpcoming; });
    var cwMovies = dedupeItemsList(allMovies.filter(hasTmdbLandscape), null, 6);
    var rankedMovies = allMovies.slice().sort(function(a, b){ return numericRating(b) - numericRating(a); });
    var top10Movies = dedupeItemsList(rankedMovies, seenMovies, 10);
    var trendingMovies = dedupeItemsList(allMovies, seenMovies, 12);
    if (cwMovies.length) h += renderSectionRow('Continue Watching', cwMovies, 'w', 0);
    h += renderSectionRow('Top 10 Movies Today', top10Movies, 'n', 1);
    h += renderSectionRow('Newly Released & Blockbuster Movies', trendingMovies, 't', 2);
    return h;
  }

  if (ST.chip === 'New & Hot') {
    var hm = API_DATA.home || {};
    var seenNH = {};
    var newRel = dedupeItemsList((API_DATA.freshTmdbItems || []).concat(hm.newReleases || []), seenNH, 12);
    var coming = dedupeItemsList(hm.comingSoon || [], seenNH, 12);

  // Default Full Home Feed with 16:9 TMDB Continue Watching + Deduplicated Sections
  var dh = API_DATA.dedupedHome || {};

    h += renderSectionRow('Continue Watching', dh.continueWatching, 'w', 0);

  (dh.extraRows || []).forEach(function(r, idx) {
    h += renderSectionRow(r.title, r.items, r.kind || 't', idx + 4);
  });
  return h;

function buildSearchBodyOnly() {
  var listToRender = API_DATA.searchResults;
  if ((!listToRender || !listToRender.length) && !API_DATA.searchQuery && API_DATA.searchType === 'all') {
    listToRender = dedupeItemsList((API_DATA.freshTmdbItems || []).concat(API_DATA.allCatalogue || []).filter(function(x) {
      return hasTmdbLandscape(x);
    }), null, 24);
  }

  var heading = API_DATA.searchQuery
    ? ('Results for “' + esc(API_DATA.searchQuery) + '”')
    : (API_DATA.searchType === 'anime' ? 'Popular Anime' : API_DATA.searchType === 'movie' ? 'Newly Released Movies' : API_DATA.searchType === 'tv' ? 'Trending Web Series' : 'Top Searches & New Releases');

  var bodyHtml = '';
  if ((API_DATA.loadingSearch || (API_DATA.loadingHome && (!listToRender || !listToRender.length))) && (!listToRender || !listToRender.length)) {
    bodyHtml = renderSearchSkeletonRows(6);
  } else if (API_DATA.searchError) {
    bodyHtml = '<div class="api-state"><h4>Search Error</h4><p>'+esc(API_DATA.searchError)+'</p><div class="btn p" data-a="retrysearch" style="max-width:160px;margin:0 auto">Retry</div></div>';
  } else {
    bodyHtml = renderMediaRows(listToRender || []);
    if (API_DATA.loadingSearch && listToRender && listToRender.length) {
      bodyHtml += renderSearchSkeletonRows(2);
    } else if (API_DATA.searchPage < API_DATA.searchTotalPages) {
      bodyHtml += '<div class="more-btn" data-a="moresearch">Load More Results (Page '+API_DATA.searchPage+' of '+API_DATA.searchTotalPages+')</div>';
    }
  }
  return {
    heading: heading,
    count: (listToRender && listToRender.length) ? listToRender.length : 0,
    bodyHtml: bodyHtml
  };
}

function updateSearchDomOrRender() {

function buildHomeEmbedUrl(tmdbId, isSeries) {
  var cleanId = String(tmdbId || '').trim();
  if (!/^[1-9]\d*$/.test(cleanId)) return '';
  if (isSeries) {
    return EMBED_PLAYER_BASE + '/tv/' + encodeURIComponent(cleanId) + '/1/1?color=f4f4f4&episodeSelector=1';
  }
  return EMBED_PLAYER_BASE + '/movie/' + encodeURIComponent(cleanId) + '?color=f4f4f4';
}

function mountHomePlayerIframe(url, seq) {
  var stageEl = document.getElementById('pl-stage');
  var loadEl = document.getElementById('pl-loading');
  var errEl = document.getElementById('pl-error');
  var msgEl = document.getElementById('pl-error-msg');
  if (!stageEl) return;

  destroyHomePlayerIframe();

  if (!url) {
    if (loadEl) loadEl.classList.add('hidden');
    if (errEl) errEl.classList.add('visible');
    if (msgEl) msgEl.textContent = PL.error || 'A valid TMDB ID was not found for this title.';
    return;
  }

  if (errEl) errEl.classList.remove('visible');
  if (loadEl) loadEl.classList.remove('hidden');

  var iframe = document.createElement('iframe');
  iframe.id = 'og-player-iframe';
  iframe.setAttribute('title', 'TheOGPirateBot player');
  iframe.setAttribute('width', '100%');
  iframe.setAttribute('height', '100%');
  iframe.setAttribute('frameborder', '0');
  iframe.setAttribute('scrolling', 'no');
  iframe.style.cssText = 'aspect-ratio:16/9;border:0;border-radius:12px;width:100%;height:100%;display:block;background:#000;';
  iframe.setAttribute('allowfullscreen', 'true');
  iframe.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture; encrypted-media');
  iframe.setAttribute('referrerpolicy', 'origin');

  var done = false;
  iframe.onload = function() {
    if (seq !== PL.seq || done) return;
    done = true;
    clearTimeout(PL.loadTimer);
    var l = document.getElementById('pl-loading');
    if (l) l.classList.add('hidden');
  };
  iframe.onerror = function() {
    if (seq !== PL.seq || done) return;
    done = true;
    clearTimeout(PL.loadTimer);
    PL.error = 'The embedded player could not load this stream right now.';
    var l = document.getElementById('pl-loading');
    if (l) l.classList.add('hidden');
    var er = document.getElementById('pl-error');
    if (er) er.classList.add('visible');
  };
  PL.loadTimer = setTimeout(function() {
    if (seq !== PL.seq || done) return;
    done = true;
    var l = document.getElementById('pl-loading');
    if (l) l.classList.add('hidden');
  }, 8500);

  stageEl.insertBefore(iframe, stageEl.firstChild);
  iframe.src = url;
}

function popen(el, fallbackTitle) {
  var seq = ++PL.seq;
  var id = (el && (el.dataset.id || el.dataset.t)) || fallbackTitle || '';
  var mapped = ST.itemMap[id] || ST.itemMap[fallbackTitle] || {};
  var tmdbId = (el && el.dataset.tmdbid) || extractTmdbNumericId(mapped) || extractTmdbNumericId({ id: id }) || '';
  var type = (el && el.dataset.type) || mapped.type || 'movie';
  var isSeries = (el && el.dataset.series === 'true') || type === 'tv' || !!mapped.isSeries;
  var title = (el && el.dataset.t) || mapped.title || fallbackTitle || 'Untitled';
  var desc = mapped.overview || '';

  PL.open = true;
  PL.loading = true;
  PL.error = null;
  PL.isSeries = isSeries;
  PL.tmdbId = tmdbId;
  PL.itemId = id;
  PL.title = title;
  PL.desc = desc;
  PL.landscape = true;

  // Immediately rotate screen automatically to landscape for video playback
  setNativePlayerMode(true, true);

  $('#pl').innerHTML = '<div class="pl-stage" id="pl-stage">' +
    '<div class="pl-floating-back" id="pclose" data-a="pclose" title="Back">' +
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>' +
    '</div>' +
    '<div class="pl-loading" id="pl-loading">' +
      '<div class="skel" style="width:54px;height:54px;border-radius:50%"></div>' +
      '<div class="skel pl-loading-bar"></div>' +
      '<small>Loading Video Player…</small>' +
    '</div>' +
    '<div class="pl-error" id="pl-error">' +
      '<h4>Stream Unavailable</h4>' +
      '<p id="pl-error-msg">' + esc(PL.error || '') + '</p>' +
      '<div class="pl-error-btns">' +
        '<button class="retry" data-a="pretry">Retry</button>' +
        '<button class="close" data-a="pclose">Back</button>' +
      '</div>' +
    '</div>' +
  '</div>';
  $('#pl').style.display = 'block';
  showHomeOverlayBack();

  var directUrl = buildHomeEmbedUrl(tmdbId, isSeries);
  if (directUrl) {
    PL.url = directUrl;
    mountHomePlayerIframe(directUrl, seq);
    return;
  }

  // Resolve canonical TMDB ID from production API if not yet cached on the element
  var lookupPath = (isSeries ? '/series/' : '/movie/') + encodeURIComponent(id);
  apiGet(lookupPath, false)
    .then(function(res) {
      var d = res && res.data;
      var foundTmdb = extractTmdbNumericId(d);
      if (foundTmdb) return foundTmdb;
      return apiGet('/search?q=' + encodeURIComponent(title) + '&type=' + (isSeries ? 'tv' : 'movie') + '&page=1&limit=5', false)
        .then(function(sRes) {
          var list = (sRes && Array.isArray(sRes.data)) ? sRes.data : [];
          for (var i = 0; i < list.length; i++) {
            var tid = extractTmdbNumericId(list[i]);
            if (tid) return tid;
          }
          return '';
        });
    })
    .catch(function() { return ''; })
    .then(function(resolvedTmdb) {
      if (seq !== PL.seq || !PL.open) return;
      if (resolvedTmdb) {
        PL.tmdbId = resolvedTmdb;
        PL.url = buildHomeEmbedUrl(resolvedTmdb, isSeries);
        mountHomePlayerIframe(PL.url, seq);
      } else {
        PL.error = 'No canonical TMDB ID was found for "' + title + '".';
        mountHomePlayerIframe('', seq);
      }
    });
}

   var platOpts = [['all', '', 'All Platforms']];
   (API_DATA.platforms || []).forEach(function(pl){
     var logoImg = pl.logo ? '<img src="'+esc(resolveImg(pl.logo))+'" alt="'+esc(pl.name)+'" onerror="this.style.display=\'none\'">' : '';
     platOpts.push([pl.id, logoImg, pl.name]);
   });
   sheet('<h3 class="t">Streaming Platforms</h3>' + opts(platOpts, 'setplat'));
   break;
 case 'setplat':
   closeSheet();
   ST.chip = null;
   ST.cat = null;
   API_DATA.heroIndex = 0;
   if (!p || p === 'all') {
     ST.plat = null;
     render(true);
   } else {
     var pLabel = (el && el.dataset.label) || p;
     ST.plat = pLabel;
     loadFilteredDiscovery('/discover?platform=' + encodeURIComponent(p) + '&status=RELEASED', pLabel, 1, false);
   }
   break;
 case 'morefilter':
   if (!API_DATA.loadingFilter && API_DATA.filterPage < API_DATA.filterTotalPages) {
     loadFilteredDiscovery(API_DATA.filterQueryPath, API_DATA.filteredTitle, API_DATA.filterPage + 1, true);
   }
   break;
 case 'stype':
   API_DATA.searchType = p || 'all';
   performApiSearch(API_DATA.searchQuery, API_DATA.searchType, 1, false);
   break;
 case 'moresearch':
   if (!API_DATA.loadingSearch && API_DATA.searchPage < API_DATA.searchTotalPages) {
     performApiSearch(API_DATA.searchQuery, API_DATA.searchType, API_DATA.searchPage + 1, true);
   }
   break;
 case 'cast':sheet('<h3 class="t">Cast to</h3>'+opts([['Living Room TV',ic('<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/>',22)],['Bedroom Speaker',ic('<rect x="6" y="3" width="12" height="18" rx="2"/><circle cx="12" cy="14" r="3"/>',22)],['Chromecast',ic('<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M3 12a5 5 0 0 1 5 5"/>',22)]],'castto'));break;
 case 'castto':closeSheet();toast('Connected to '+p);break;
 case 'menu':sheet('<h3 class="t">Menu</h3>'+opts([['Account'],['App Settings'],['Help'],['Sign Out']],'menu2'));break;
 case 'menu2':closeSheet();if(p==='Account'||p==='App Settings'){ST.sub=p==='Account'?'account':'settings';render()}else if(p==='Help')act('help');else act('signout');break;
 case 'help':sheet('<h3 class="t">Help &amp; Support</h3>'+opts([['Reload Production Catalogue'],['Check API Status'],['Clear Saved List &amp; Likes']],'helpitem'));break;
 case 'helpitem':
   closeSheet();
   if (p === 'Reload Production Catalogue') {
     memCache = {};
     loadInitialProductionData(true);
     toast('Refreshing catalogue…');
   } else if (p === 'Clear Saved List & Likes') {
     ST.list = []; ST.liked = []; saveST(); render(true);
     toast('Saved lists cleared');
   } else {
     toast('API Online: anymovie.ai.studio');
   }
   break;
 case 'profiles':sheet('<h3 class="t">Who’s watching?</h3>'+opts(ST.profs.map(function(x){return [x+(x===ST.prof?'  ✓':'')]}),'switchp')+opts([['Add Profile']],'addp'));break;
 case 'switchp':ST.prof=p.replace(/\s+✓$/,'');closeSheet();render(true);break;
 case 'addp':ST.profs.push('Profile '+(ST.profs.length+1));act('profiles');break;
 case 'signout':sheet('<h3 class="t">Reset session on ZORVÉN?</h3><div class="btns" style="margin-top:12px"><div class="btn s" data-a="closesheet">Cancel</div><div class="btn p" data-a="signout2">Reset</div></div>');break;
 case 'signout2':closeSheet();ST.tab=0;ST.sub=null;ST.chip=null;ST.cat=null;ST.plat=null;render();toast('Returned to Home');break;
 case 'closesheet':closeSheet();break;
 case 'play':closeSheet();popen(el, t || itemId);break;
 case 'open':pclose();openDetailFromElement(el);break;
 case 'list':var added=tg(ST.list,itemId);syncList(itemId);toast(added?'Added to My List':'Removed from My List');if(ST.tab===3&&!ST.sub)render(true);if(ST.sub==='mylist')render(true);break;
 case 'like':tg(ST.liked,itemId);syncLike(itemId);if(ST.tab===3&&!ST.sub)render(true);break;
 case 'dldel':tg(ST.dl,itemId);render(true);toast('Download removed');break;
 case 'share':var u='https://anymovie.ai.studio/api/v1/content/'+encodeURIComponent(itemId);try{navigator.clipboard.writeText(u)}catch(e){}toast('Link copied');break;
 case 'mute':$('.phone').classList.toggle('muted');break;
 case 'tog':ST.set[p]=!ST.set[p];saveST();var s=el.querySelector('.sw');if(s)s.classList.toggle('on',ST.set[p]);break;
 case 'toast':toast(p);break;
 case 'mic':var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Voice search isn’t available here');break}try{var r=new SR();r.onresult=function(e){var q=$('#q');q.value=e.results[0][0].transcript;q.dispatchEvent(new Event('input',{bubbles:true}))};r.start();toast('Listening…')}catch(e){toast('Voice search isn’t available here')}break;
 case 'pclose':pclose();break;
 case 'pretry':
   if (PL.url) mountHomePlayerIframe(PL.url, ++PL.seq);
   break;
 case 'plandscape':
   PL.landscape = !PL.landscape;
   var plEl = $('#pl');
   if (plEl) plEl.classList.toggle('is-landscape', PL.landscape);
   setNativePlayerMode(true, PL.landscape);
   break}}

var moved=false;
document.addEventListener('click',function(e){if(moved){moved=false;e.stopPropagation();e.preventDefault();return}
 var el=e.target.closest('[data-a]');if(!el)return;
 if (el.dataset.a === 'play' || el.dataset.a === 'list') {
   e.stopPropagation();
 }
 act(el.dataset.a,el.dataset.p,el.dataset.t,el)},true);

document.addEventListener('input',function(e){
 if(e.target.id!=='q')return;
 var val = e.target.value;
 API_DATA.searchQuery = val;
 clearTimeout(searchTimer);
 searchTimer = setTimeout(function() {
   performApiSearch(val, API_DATA.searchType, 1, false);
 }, 260);
});

/* drag scrolling for chips and rails (mouse) + touch for chips */
var dn=null;
document.addEventListener('mousedown',function(e){var s=e.target.closest('.chips,.rail');if(s)dn={s:s,x:e.pageX,l:s.scrollLeft}});
window.addEventListener('mousemove',function(e){if(!dn)return;var dx=e.pageX-dn.x;if(Math.abs(dx)>5)moved=true;dn.s.scrollLeft=dn.l-dx});
window.addEventListener('mouseup',function(){dn=null;setTimeout(function(){moved=false},0)});
document.addEventListener('wheel',function(e){var s=e.target.closest('.chips,.rail');if(s&&Math.abs(e.deltaX)<Math.abs(e.deltaY)&&s.scrollWidth>s.clientWidth){s.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
var tc=null;
document.addEventListener('touchstart',function(e){var s=e.target.closest('.chips');if(!s){tc=null;return}var t=e.touches[0];tc={s:s,x:t.clientX,y:t.clientY,l:s.scrollLeft,d:0}},{passive:true});
document.addEventListener('touchmove',function(e){if(!tc)return;var t=e.touches[0],dx=t.clientX-tc.x,dy=t.clientY-tc.y;if(!tc.d&&(Math.abs(dx)>4||Math.abs(dy)>4))tc.d=Math.abs(dx)>Math.abs(dy)?1:2;if(tc.d===1){tc.s.scrollLeft=tc.l-dx;e.preventDefault()}},{passive:false});
window.addEventListener('pageshow',function(){try{var s=sessionStorage.getItem('Z_APP_STATE');if(s){ST=JSON.parse(s);if(!ST.itemMap)ST.itemMap={};render(true)}}catch(e){}});
window.addEventListener('resize',fit);
if (restoreHomeCache()) {
  render(false);
  startHeroAutoCycle();
}
loadInitialProductionData(false);
})();
</script>
</body>
</html>
