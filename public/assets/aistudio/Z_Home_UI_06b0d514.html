 if(s==='settings')return top('App Settings','',1)+[['smart','Smart Downloads'],['wifi','Wi-Fi only downloads'],['auto','Autoplay previews'],['push','Push notifications']].map(function(x){return '<div class="mr" data-a="tog" data-p="'+x[0]+'"><div>'+x[1]+'</div><div class="sw'+(ST.set[x[0]]?' on':'')+'"></div></div>'}).join('')}
function fit(){var cf=$('.cf');if(cf){cf.style.height=Math.max(280,innerHeight-cf.getBoundingClientRect().top-scrollY-$('.nav').offsetHeight-8)+'px'}}

 sheet('<div class="dbn" style="background:'+g(gi(t))+'">'+Z(14)+'</div><h3 class="dt">'+t+'</h3><p class="dm">2026 &bull; TV-MA &bull; Drama &bull; Thriller</p><div class="btns"><div class="btn p" data-a="play" data-t="'+t+'">'+I.play+'Play</div><div class="btn s" data-a="list" data-t="'+t+'"><span class="pi">'+pi(t)+'</span>My List</div></div><div class="acts"><div class="like'+(lk?' on':'')+'" data-a="like" data-t="'+t+'">'+I.like+'Rate</div><div data-a="dldt" data-t="'+t+'">'+(d?ic('<path d="m5 12.5 4.5 4.5L19 7.5"/>',26):I.dl.replace('width="24" height="24"','width="26" height="26"'))+(d?'Downloaded':'Download')+'</div><div data-a="share" data-t="'+t+'">'+I.share+'Share</div></div>')}

/* player */

function act(a,p,t,el){
 switch(a){
 case 'tab':closeSheet();ST.tab=+p;ST.sub=null;render();break;
 case 'search':ST.tab=2;ST.sub=null;render();break;
 case 'sub':ST.sub=p;render();break;

 case 'castto':closeSheet();toast('Casting to '+p);break;

 case 'menu2':closeSheet();if(p==='Account'||p==='App Settings'){ST.sub=p==='Account'?'account':'settings';render()}else if(p==='Help')act('help');else act('signout');break;
 case 'help':sheet('<h3 class="t">Help</h3>'+opts([['Help Center'],['Contact Us'],['Report a problem']],'helpitem'));break;
 case 'helpitem':closeSheet();toast(p+' is a demo here');break;
 case 'profiles':sheet('<h3 class="t">Who’s watching?</h3>'+opts(ST.profs.map(function(x){return [x+(x===ST.prof?'  ✓':'')]}),'switchp')+opts([['Add Profile']],'addp'));break;
 case 'switchp':ST.prof=p.replace(/\s+✓$/,'');closeSheet();render(true);break;
 case 'addp':ST.profs.push('Profile '+(ST.profs.length+1));act('profiles');break;
 case 'signout':sheet('<h3 class="t">Sign out of Z?</h3><div class="btns" style="margin-top:12px"><div class="btn s" data-a="closesheet">Cancel</div><div class="btn p" data-a="signout2">Sign Out</div></div>');break;
 case 'signout2':closeSheet();ST.tab=0;ST.sub=null;render();toast('Signed out (demo)');break;
 case 'closesheet':closeSheet();break;

 case 'list':var added=tg(ST.list,t);syncList(t);toast(added?'Added to My List':'Removed from My List');if(ST.tab===3&&!ST.sub)render(true);if(ST.sub==='mylist')render(true);if(ST.sheet)detail(ST.sheet);break;

 case 'mute':$('.phone').classList.toggle('muted');break;
 case 'tog':ST.set[p]=!ST.set[p];var s=el.querySelector('.sw');if(s)s.classList.toggle('on',ST.set[p]);break;
 case 'toast':toast(p);break;
 case 'mic':var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Voice search isn’t available here');break}try{var r=new SR();r.onresult=function(e){var q=$('#q');q.value=e.results[0][0].transcript;q.dispatchEvent(new Event('input',{bubbles:true}))};r.start();toast('Listening…')}catch(e){toast('Voice search isn’t available here')}break;
 case 'pclose':pclose();break;
 case 'pplay':PL.on=!PL.on;$('#pl').innerHTML=pbody();break;
 case 'pseek':PL.pos=Math.max(0,Math.min(PL.dur,PL.pos+(+p)));var r2=$('#pr');if(r2)r2.value=PL.pos;$('#pc').textContent=mmss(PL.pos);break}}
var moved=false;
document.addEventListener('click',function(e){if(moved){moved=false;e.stopPropagation();e.preventDefault();return}

 if(e.target.id!=='q')return;var v=e.target.value.trim().toLowerCase(),l=v?T.filter(function(t){return t.toLowerCase().indexOf(v)>-1}):T;

/* drag scrolling for chips and rails (mouse) + touch for chips */
var dn=null;
document.addEventListener('mousedown',function(e){var s=e.target.closest('.chips,.rail');if(s)dn={s:s,x:e.pageX,l:s.scrollLeft}});
window.addEventListener('mousemove',function(e){if(!dn)return;var dx=e.pageX-dn.x;if(Math.abs(dx)>5)moved=true;dn.s.scrollLeft=dn.l-dx});
window.addEventListener('mouseup',function(){dn=null;setTimeout(function(){moved=false},0)});
document.addEventListener('wheel',function(e){var s=e.target.closest('.chips,.rail');if(s&&Math.abs(e.deltaX)<Math.abs(e.deltaY)&&s.scrollWidth>s.clientWidth){s.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
var tc=null;
document.addEventListener('touchstart',function(e){var s=e.target.closest('.chips');if(!s){tc=null;return}var t=e.touches[0];tc={s:s,x:t.clientX,y:t.clientY,l:s.scrollLeft,d:0}},{passive:true});
document.addEventListener('touchmove',function(e){if(!tc)return;var t=e.touches[0],dx=t.clientX-tc.x,dy=t.clientY-tc.y;if(!tc.d&&(Math.abs(dx)>4||Math.abs(dy)>4))tc.d=Math.abs(dx)>Math.abs(dy)?1:2;if(tc.d===1){tc.s.scrollLeft=tc.l-dx;e.preventDefault()}},{passive:false});

render();
})();
